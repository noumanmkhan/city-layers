name: Fetch representatives
# Downloads the current councillors, MPPs and MPs from toronto.ca, ola.org and ourcommons.ca
# into pipeline/raw/representatives/ and commits them back to the branch that ran it.
on:
  workflow_dispatch:
  push:
    branches: [fetch-representatives]
    paths: ['pipeline/fetch_representatives.py', '.github/workflows/fetch-representatives.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 pipeline/fetch_representatives.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add pipeline/raw/representatives
          git commit -m "Fetch current councillors, MPPs and MPs" || echo "no changes"
          git push
