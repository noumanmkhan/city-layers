name: Compute transit times to the Loop
# Downloads CTA and Metra schedules plus an OpenStreetMap extract, routes a weekday morning trip
# to the Loop from points across every Chicago community area with r5py, and commits
# cities/chicago/raw/transit_loop.json and its log back to the branch that ran it.
on:
  workflow_dispatch:
  push:
    branches: [fetch-transit-loop]
    paths: ['cities/chicago/fetch_transit_loop.py', '.github/workflows/fetch-transit-loop.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install r5py geopandas shapely
      - run: set -o pipefail; python3 -u cities/chicago/fetch_transit_loop.py 2>&1 | tee cities/chicago/raw/transit_loop.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/chicago/raw/transit_loop.log; if [ -f cities/chicago/raw/transit_loop.json ]; then git add cities/chicago/raw/transit_loop.json; fi
          git commit -m "Compute transit times from each community area to the Loop" || echo "no changes"
          git push
