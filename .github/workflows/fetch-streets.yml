name: Fetch street centrelines
# Downloads arterial and collector roads from the City of Toronto GIS server into
# cities/toronto/raw/streets.json and commits the file back to the branch that ran it.
on:
  workflow_dispatch:
  push:
    branches: [fetch-streets]
    paths: ['cities/toronto/fetch_streets.py', '.github/workflows/fetch-streets.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 cities/toronto/fetch_streets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/toronto/raw/streets.json
          git commit -m "Fetch arterial and collector centrelines" || echo "no changes"
          git push
