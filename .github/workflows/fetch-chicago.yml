name: Fetch Chicago data
# Runs a Chicago fetch script and commits what it writes under cities/chicago/raw/
# back to the branch that ran it. The sandbox can't reach these hosts; Actions can.
on:
  workflow_dispatch:
    inputs:
      script: {description: 'Script in cities/chicago/ to run', default: 'fetch.py'}
  push:
    branches: [fetch-chicago]
    paths: ['cities/chicago/discover.py', 'cities/chicago/fetch*.py', '.github/workflows/fetch-chicago.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 cities/chicago/${{ inputs.script || 'discover.py' }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/chicago/raw
          git commit -m "Fetch Chicago data (${{ inputs.script || 'discover.py' }})" || echo "no changes"
          git push
