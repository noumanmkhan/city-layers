name: Fetch GTA highways
# Downloads the GTA's motorways from OpenStreetMap (Overpass API) into
# pipeline/raw/gta_motorways.json and commits the file back to the branch that ran it.
on:
  workflow_dispatch:
  push:
    branches: [fetch-gta-highways]
    paths: ['pipeline/fetch_gta_highways.py', '.github/workflows/fetch-gta-highways.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 pipeline/fetch_gta_highways.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add pipeline/raw/gta_motorways.json
          git commit -m "Fetch GTA motorways from OpenStreetMap" || echo "no changes"
          git push
