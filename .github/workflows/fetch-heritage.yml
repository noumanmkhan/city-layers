name: Fetch heritage districts
# Downloads each city's heritage district boundaries (Toronto's Heritage Conservation Districts,
# Chicago's Landmark Districts) into cities/<city>/raw/ and commits them back to the branch that ran it.
# The sandbox can't reach the cities' servers; Actions can. Runs when a fetch_heritage.py changes on
# main, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cities/*/fetch_heritage.py', '.github/workflows/fetch-heritage.yml']
permissions:
  contents: write
concurrency: fetch-heritage
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      # Each city on its own, so one failing doesn't lose the other. The logs are committed too.
      - run: |
          for c in toronto chicago; do
            mkdir -p cities/$c/raw
            python3 -u cities/$c/fetch_heritage.py 2>&1 | tee cities/$c/raw/fetch_heritage.log || true
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/toronto/raw cities/chicago/raw
          git commit -m "Fetch heritage district boundaries" || echo "no changes"
          git pull --rebase
          git push
