name: Fetch streetcar and bus routes
# Downloads each city's agency GTFS (cities/<city>/surface.json) and writes streetcar and bus
# routes, stops and trips-per-hour counts into cities/<city>/raw/surface/, then commits to main.
# Runs when the fetch script or a surface.json changes on main, on the 5th of each month
# (agencies change service a few times a year), or by hand. Rebuild with cities/<city>/run.sh.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 5 * *'
  push:
    branches: [main]
    paths: ['engine/fetch_surface.py', 'cities/*/surface.json', '.github/workflows/fetch-surface.yml']
permissions:
  contents: write
concurrency: fetch-surface
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: |
          for c in toronto chicago; do
            mkdir -p cities/$c/raw/surface
            python3 -u engine/fetch_surface.py $c 2>&1 | tee cities/$c/raw/surface/fetch.log || true
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/toronto/raw/surface cities/chicago/raw/surface
          git commit -m "Fetch streetcar and bus routes from the agencies' GTFS" || echo "no changes"
          git pull --rebase
          git push
