name: Scout road closure data
# One-off check of transit-related road closures in Toronto (City road restrictions feed) and
# Chicago (CDOT permits), limited to the arterials the map draws. Writes scouting/closures/out/
# and commits it to main. Doesn't touch the site. Runs when scout.py changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scouting/closures/scout.py']
permissions:
  contents: write
concurrency: scout-closures
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p scouting/closures/out
          python3 -u scouting/closures/scout.py 2>&1 | tee scouting/closures/out/scout.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scouting/closures/out
          git commit -m "Road closure scouting report" || echo "no changes"
          git pull --rebase
          git push
