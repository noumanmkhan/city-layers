name: Scout skyscraper data
# One-off check of how complete open skyscraper data is for Toronto and Chicago (Wikidata, Wikipedia's
# tallest-buildings lists, OpenStreetMap). Writes scouting/skyscrapers/out/ and commits it to main.
# Doesn't touch the site. Runs when scout.py changes on main, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scouting/skyscrapers/scout.py']
permissions:
  contents: write
concurrency: scout-skyscrapers
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas lxml
      - run: |
          mkdir -p scouting/skyscrapers/out
          python3 -u scouting/skyscrapers/scout.py 2>&1 | tee scouting/skyscrapers/out/scout.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scouting/skyscrapers/out
          git commit -m "Skyscraper scouting report" || echo "no changes"
          git pull --rebase
          git push
