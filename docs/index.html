	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:last-child {

	}

	}

.leaflet-touch .leaflet-bar a {

}

}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--font)}
.leaflet-container :focus-visible{outline:2px solid var(--focus)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-bar{box-shadow:var(--shadow)!important;border:none!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:1000;top:16px;left:16px;bottom:16px;width:300px;display:flex;flex-direction:column;
  background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ph{padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px}
.ph .grab{display:none}
#layers{overflow:auto;padding:6px 10px 14px;flex:1;min-height:0}
.grp{margin-top:10px}
.grp h2{margin:8px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:9px;cursor:pointer;user-select:none}
.row:hover{background:var(--pill-bg)}
.row input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:30px;height:22px;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:13.5px}
.tx span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.tg{flex:none;width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;margin-top:2px;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.row input:checked ~ .tg{background:var(--accent)}
.row input:checked ~ .tg::after{transform:translateX(14px)}
.row input:focus-visible ~ .tg{outline:2px solid var(--focus);outline-offset:2px}
.sub{margin:-4px 0 4px 48px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sub input{accent-color:var(--accent);margin:0}
.pf{padding:10px 18px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.pf button{font:inherit;color:var(--ink-2);background:none;border:1px solid var(--rule);border-radius:7px;padding:4px 9px;cursor:pointer}
.pf button:hover{color:var(--ink)}

/* swatches */
.sw.boroughs{background:conic-gradient(var(--b-etobicoke) 0 17%,var(--b-northyork) 0 34%,var(--b-scarborough) 0 51%,var(--b-york) 0 68%,var(--b-eastyork) 0 84%,var(--b-oldtoronto) 0)}
.sw.areas{background:linear-gradient(90deg,var(--a-westend) 0 20%,var(--a-downtown) 0 40%,var(--a-midtown) 0 60%,var(--a-uptown) 0 80%,var(--a-eastend) 0)}
.sw.nbhd{background:var(--city);background-image:linear-gradient(var(--nbhd) 1px,transparent 1px),linear-gradient(90deg,var(--nbhd) 1px,transparent 1px);background-size:9px 8px;background-position:3px 3px}
.sw.cultural{background:var(--city);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--cult);font-style:italic}
.sw.wards{background:var(--city);box-shadow:inset 0 0 0 2px var(--ward)}
.sw.prov{background:var(--city);background-image:repeating-linear-gradient(90deg,var(--prov) 0 4px,transparent 4px 7px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 50%}
.sw.fed{background:var(--city);box-shadow:inset 0 0 0 2px var(--fed)}
.sw.bia{background:color-mix(in srgb,var(--bia) 45%,var(--city))}
.sw.hwy{background:var(--city);background-image:linear-gradient(var(--hwy-case),var(--hwy-case)),linear-gradient(var(--hwy),var(--hwy));background-size:100% 6px,100% 2px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.subway{background:linear-gradient(var(--l1) 0 25%,var(--l2) 0 50%,var(--l5) 0 75%,var(--l4) 0)}

/* ---------- map styling (CSS overrides Leaflet's SVG attributes, so both themes work) ---------- */
.base-out{fill:var(--land-out);fill-opacity:1;stroke:var(--land-out-line);stroke-width:1}
.base-city{fill:var(--city);fill-opacity:1;stroke:var(--city-line);stroke-width:1.6}
.boro{fill-opacity:.55;stroke:var(--city);stroke-width:2}
.boro.old-toronto{fill:var(--b-oldtoronto)} .boro.york{fill:var(--b-york)} .boro.north-york{fill:var(--b-northyork)}
.boro.east-york{fill:var(--b-eastyork)} .boro.etobicoke{fill:var(--b-etobicoke)} .boro.scarborough{fill:var(--b-scarborough)}
.area{fill-opacity:.6;stroke:var(--city);stroke-width:2}
.area.downtown{fill:var(--a-downtown)} .area.midtown{fill:var(--a-midtown)} .area.uptown{fill:var(--a-uptown)}
.area.west-end{fill:var(--a-westend)} .area.east-end{fill:var(--a-eastend)}
.nbhd{fill:var(--nbhd-fill);fill-opacity:0;stroke:var(--nbhd);stroke-width:.9;stroke-opacity:.7}
.nbhd:hover{fill-opacity:.12}
.ward{fill:var(--ward);fill-opacity:0;stroke:var(--ward);stroke-width:2.2}
.ward:hover{fill-opacity:.08}
.prov{fill:var(--prov);fill-opacity:0;stroke:var(--prov);stroke-width:2;stroke-dasharray:6 4}
.prov:hover{fill-opacity:.08}
.fed{fill:var(--fed);fill-opacity:0;stroke:var(--fed);stroke-width:2.2;stroke-dasharray:1 0}
.fed:hover{fill-opacity:.08}
.bia{fill:var(--bia);fill-opacity:.45;stroke:var(--bia);stroke-width:1.2}
.bia:hover{fill-opacity:.7}
.hwy-case{stroke:var(--hwy-case);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy-core{stroke:var(--hwy);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy-core.city{stroke:var(--hwy-city)}
.sub-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sub-line.l1{stroke:var(--l1)} .sub-line.l2{stroke:var(--l2)} .sub-line.l4{stroke:var(--l4)} .sub-line.l5{stroke:var(--l5)} .sub-line.l6{stroke:var(--l6)}
.stn{fill:var(--station);stroke:var(--ink);stroke-width:1.5}
.stn.x{stroke-width:2.2}
.pin{display:block;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 28%,transparent),0 2px 8px rgba(0,0,0,.4)}

/* labels */
.leaflet-tooltip.lbl{background:none;border:none;box-shadow:none;padding:0;color:var(--ink);font-family:var(--font);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.leaflet-tooltip.lbl::before{display:none}
.lbl-boro{font-size:15px;font-weight:800;letter-spacing:-.01em}
.lbl-area{font-size:13px;font-weight:700}
.lbl-nbhd{font-size:10.5px;font-weight:500;color:var(--ink-2)!important;max-width:120px;white-space:normal!important;text-align:center;line-height:1.15}
.lbl-cult{font-size:11.5px;font-weight:600;font-style:italic;color:var(--cult)!important}
.lbl-cult.enclave{color:var(--cult-enclave)!important}
.lbl-ward{font-size:11px;font-weight:700;color:var(--ward)!important}
.lbl-prov{font-size:11px;font-weight:700;color:var(--prov)!important}
.lbl-fed{font-size:11px;font-weight:700;color:var(--fed)!important}
.lbl-bia{font-size:10px;font-weight:600;color:var(--bia)!important}
.lbl-stn{font-size:10px;font-weight:600}
.lbl-stn.end{font-size:11px;font-weight:700}
.stn.end{stroke-width:2.6}
.poi{display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.poi i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--panel);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink),0 1px 3px rgba(0,0,0,.25)}
.poi i svg{width:14px;height:14px}
.poi b{font:700 11.5px/1.15 var(--font);color:var(--ink);text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
#map:not(.z12) .poi b{display:none}
.lbl-muni{font-size:13px;font-weight:500;font-style:italic;color:var(--muni-label)!important;text-shadow:none}
.lbl-lake{font-size:24px;font-weight:600;font-style:italic;color:color-mix(in srgb,var(--water) 40%,#2F7FD8)!important;text-shadow:none;letter-spacing:.02em}
.shield{display:grid;place-items:center;height:18px;min-width:26px;padding:0 4px;border-radius:5px;background:var(--shield);color:#fff;
  font:700 10.5px/1 var(--font);box-shadow:0 0 0 1.5px #fff;white-space:nowrap}
.shield.city{background:var(--shield-city)}
.hover-tip{background:var(--panel)!important;color:var(--ink)!important;border:1px solid var(--rule)!important;box-shadow:var(--shadow)!important;font:600 12px/1.3 var(--font)!important;border-radius:7px!important;padding:4px 8px!important}
.hover-tip::before{display:none}
/* zoom-gated labels */
#map:not(.z11) .lbl-area,#map:not(.z11) .lbl-ward,#map:not(.z11) .lbl-prov,#map:not(.z11) .lbl-fed{display:none}
#map:not(.z12) .lbl-cult,#map:not(.z12) .shield.minor{display:none}
#map:not(.z13) .lbl-nbhd,#map:not(.z13) .lbl-stn:not(.end){display:none}
#map:not(.z11) .lbl-stn.end{display:none}
#map:not(.z14) .lbl-bia{display:none}
#map.z13 .lbl-boro{opacity:.35}

/* ---------- readout ---------- */
#side{position:absolute;z-index:1000;top:16px;right:16px;width:320px;display:flex;flex-direction:column;gap:10px}
#here{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#search{position:relative;background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
#search form{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#search svg{flex:none;width:16px;height:16px;color:var(--ink-3)}
#q{flex:1;min-width:0;font:500 14px/1.2 var(--font);color:var(--ink);background:none;border:none;outline:none;padding:8px 0}
#q::placeholder{color:var(--ink-3)}
#search:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--focus)}
#go{flex:none;font:600 12.5px/1 var(--font);color:#fff;background:var(--accent);border:none;border-radius:9px;padding:9px 12px;cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
#results{list-style:none;margin:0;padding:4px 6px 6px;border-top:1px solid var(--rule)}
#results li button{display:block;width:100%;text-align:left;font:500 13px/1.3 var(--font);color:var(--ink);background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer}
#results li button:hover,#results li button:focus-visible{background:var(--pill-bg);outline:none}
#results li button span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
#results .msg{padding:8px 10px;color:var(--ink-2);font-size:12.5px}
.credit{padding:0 16px 8px;font-size:10.5px;color:var(--ink-3)}
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.hh small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hh strong{display:block;font-size:15px;font-weight:700;margin-top:2px}
.hh button{flex:none;font:inherit;font-size:18px;line-height:1;width:28px;height:28px;border-radius:7px;border:none;background:var(--pill-bg);color:var(--ink-2);cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--pill-bg);font-weight:600;font-size:12.5px}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
dl.facts{margin:0;padding:10px 16px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0;font-weight:500;min-width:0}
.more{display:none;width:100%;font:600 12px/1 var(--font);color:var(--ink-2);background:none;border:none;border-top:1px solid var(--rule);padding:9px;cursor:pointer}
.hint{padding:12px 16px 14px;color:var(--ink-2);font-size:12.5px;border-top:1px solid var(--rule)}

@media (max-width:760px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:46%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.collapsed #layers,#panel.collapsed .pf{display:none}
  .ph{padding:8px 16px 10px;cursor:pointer}
  .ph .grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}
  .ph h1{font-size:17px}
  .ph p{display:none}
  #side{top:12px;left:12px;right:12px;width:auto;gap:8px}
  #here:not(.open) dl.facts{display:none}
  .hh{padding:10px 12px 6px}
  .pills{padding:0 12px 8px}
  .more{display:block!important}
  .leaflet-top.leaflet-left{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Map of the City of Toronto"></div>

  <aside id="panel" aria-label="Map layers">
    <div class="ph" id="ph">
      <div class="grab" aria-hidden="true"></div>
      <h1>Toronto Layers</h1>
      <p>Turn layers on and off. Search an address or tap anywhere on the map to see every boundary that spot falls inside.</p>
    </div>
    <div id="layers"></div>
    <div class="pf">
      <button type="button" id="allOff">Hide all layers</button>
    </div>
  </aside>

  <div id="side">
    <div id="search" role="search">
      <form id="qf" autocomplete="off">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5" stroke-linecap="round"/></svg>
        <label for="q" class="vh">Search a Toronto address</label>
        <input id="q" type="search" placeholder="Search a Toronto address" enterkeyhint="search">
        <button id="go" type="submit">Find</button>
      </form>
      <ul id="results" hidden></ul>
    </div>
    <section id="here" aria-live="polite"></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
const DATA = 'data/';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const GROUPS = [
  ['Places', [
    {id:'boroughs', name:'Former cities', note:'The 6 municipalities merged in 1998', on:true},
    {id:'areas', name:'Old Toronto areas', note:'Downtown, Midtown, Uptown, West End, East End'},
    {id:'nbhd', name:'Neighbourhoods', note:'The City’s 158 official neighbourhoods'},
    {id:'cultural', name:'Known-as names', note:'King West, Little Italy, the Junction…', swatch:'Aa'},
  ]],
  ['Representation', [
    {id:'wards', name:'City wards', note:'25 wards, one councillor each'},
    {id:'prov', name:'Provincial ridings', note:'25 MPPs · same lines as the wards'},
    {id:'fed', name:'Federal ridings', note:'24 MPs · 2023 boundaries'},
    {id:'bia', name:'Business Improvement Areas', note:'85 BIAs'},
  ]],
  ['Getting around', [
    {id:'hwy', name:'Highways', note:'400-series, QEW, DVP, Gardiner, Allen', on:true},
    {id:'subway', name:'Subway & LRT', note:'Lines 1, 2, 4, 5 and 6', on:true, sub:{id:'stnNames', label:'Show station names', on:true}},
  ]],
];

const map = L.map('map', {zoomSnap:.25, zoomDelta:.5, minZoom:8.5, maxZoom:17, attributionControl:true, zoomControl:true, preferCanvas:false});
map.attributionControl.setPrefix(false);
window.torontoMap = map;
map.attributionControl.addAttribution('Boundaries & roads: City of Toronto Open Data · Ridings: Elections Canada / Elections Ontario via Open North · Transit: TTC GTFS · Neighbouring municipalities & address search: © OpenStreetMap contributors via Nominatim');
const CITY_BOUNDS = L.latLngBounds([43.581,-79.639],[43.855,-79.115]);
const wide = () => !matchMedia('(max-width:760px)').matches;
map.fitBounds(CITY_BOUNDS, wide() ? {paddingTopLeft:[330,20], paddingBottomRight:[350,20]} : {paddingTopLeft:[0,150], paddingBottomRight:[0,90]});
map.setMaxBounds(CITY_BOUNDS.pad(.6));

const panes = [['base',200],['fill',350],['lines',420],['civic',430],['hwy',450],['transit',470],['pts',480],['pin',620]];
panes.forEach(([n,z]) => { map.createPane(n); map.getPane(n).style.zIndex = z; });
map.getPane('base').style.pointerEvents = 'none';

const layers = {}; const data = {};
const get = f => fetch(DATA + f + '.geojson').then(r => { if (!r.ok) throw new Error(f); return r.json(); });

function zoomClasses(){
  const z = map.getZoom(), el = map.getContainer();
  [11,12,13,14].forEach(t => el.classList.toggle('z'+t, z >= t - .01));
}
map.on('zoomend', zoomClasses); zoomClasses();

function label(text, cls, latlng){
  return L.tooltip({permanent:true, direction:'center', className:'lbl ' + cls, pane:'tooltipPane', interactive:false}).setLatLng(latlng).setContent(text);
}
const ll = p => [p[1], p[0]];
function hoverTip(layer, text){ layer.bindTooltip(text, {sticky:true, className:'hover-tip', direction:'top', offset:[0,-8]}); }

function polyLayer(fc, opts){
  const g = L.layerGroup();
  const geo = L.geoJSON(fc, {pane: opts.pane || 'fill', style: f => ({className: opts.cls(f), weight: 1}),
    onEachFeature: (f, lyr) => { if (opts.hover) hoverTip(lyr, opts.hover(f)); lyr.on('click', e => inspect(e.latlng)); }});
  g.addLayer(geo);
  if (opts.label) fc.features.forEach(f => { const t = opts.label(f); if (t) g.addLayer(label(t, opts.lcls(f), ll(f.properties.lp))); });
  return g;
}

/* ---------- geometry helpers for "What's here" ---------- */
function inRing(x, y, r){ let ins = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1]; if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins = !ins; } return ins; }
function inPoly(x, y, c){ if (!inRing(x, y, c[0])) return false; for (let k = 1; k < c.length; k++) if (inRing(x, y, c[k])) return false; return true; }
function contains(geom, x, y){ if (geom.type === 'Polygon') return inPoly(x, y, geom.coordinates); if (geom.type === 'MultiPolygon') return geom.coordinates.some(c => inPoly(x, y, c)); return false; }
function hit(fc, x, y){ return fc ? fc.features.find(f => contains(f.geometry, x, y)) : null; }
function metres(a, b){ const k = Math.PI/180, dx = (a[0]-b[0])*k*Math.cos(a[1]*k)*6371000, dy = (a[1]-b[1])*k*6371000; return Math.hypot(dx, dy); }

/* ---------- build layers ---------- */
const BORO_ORDER = ['Etobicoke','York','North York','East York','Old Toronto','Scarborough'];
const AREA_VAR = {'Downtown':'--a-downtown','Midtown':'--a-midtown','Uptown':'--a-uptown','West End':'--a-westend','East End':'--a-eastend'};
const BORO_VAR = {'Old Toronto':'--b-oldtoronto','York':'--b-york','North York':'--b-northyork','East York':'--b-eastyork','Etobicoke':'--b-etobicoke','Scarborough':'--b-scarborough'};

function buildBase(fc){
  const g = L.geoJSON(fc, {pane:'base', interactive:false, style: f => ({className: f.properties.kind === 'city' ? 'base-city' : 'base-out'})});
  g.addTo(map);
  fc.features.filter(f => f.properties.kind === 'neighbour').forEach(f => label(f.properties.name, 'lbl-muni', ll(f.properties.lp)).addTo(map));
  label('Lake Ontario', 'lbl-lake', [43.585, -79.40]).addTo(map);
  const PLANE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
  [['Billy Bishop Airport', 43.6275, -79.3962]].forEach(([name, lat, lng]) => {
    L.marker([lat, lng], {pane:'pts', interactive:false, keyboard:false,
      icon: L.divIcon({className:'', iconSize:null, iconAnchor:[12, 12], html:'<span class="poi"><i>' + PLANE + '</i><b>' + name + '</b></span>'})}).addTo(map);
  });
  map.on('click', e => inspect(e.latlng));
}

const BUILD = {
  boroughs: fc => polyLayer(fc, {cls: f => 'boro ' + slug(f.properties.name), label: f => f.properties.name, lcls: () => 'lbl-boro', hover: f => f.properties.name}),
  areas: fc => polyLayer(fc, {cls: f => 'area ' + slug(f.properties.name), label: f => f.properties.name, lcls: () => 'lbl-area', hover: f => f.properties.name}),
  nbhd: fc => polyLayer(fc, {pane:'lines', cls: () => 'nbhd', label: f => f.properties.name, lcls: () => 'lbl-nbhd', hover: f => f.properties.name + ' · #' + f.properties.code}),
  wards: fc => polyLayer(fc, {pane:'civic', cls: () => 'ward', label: f => 'Ward ' + f.properties.num, lcls: () => 'lbl-ward', hover: f => 'Ward ' + f.properties.num + ' · ' + f.properties.name}),
  prov: fc => polyLayer(fc, {pane:'civic', cls: () => 'prov', label: f => f.properties.prov, lcls: () => 'lbl-prov', hover: f => 'Provincial: ' + f.properties.prov}),
  fed: fc => polyLayer(fc, {pane:'civic', cls: () => 'fed', label: f => f.properties.name, lcls: () => 'lbl-fed', hover: f => 'Federal: ' + f.properties.name}),
  bia: fc => polyLayer(fc, {pane:'civic', cls: () => 'bia', label: f => f.properties.name, lcls: () => 'lbl-bia', hover: f => f.properties.name + ' BIA'}),
  cultural: fc => {
    const g = L.layerGroup();
    fc.features.forEach(f => g.addLayer(label(f.properties.name, 'lbl-cult' + (f.properties.kind === 'enclave' ? ' enclave' : ''), ll(f.geometry.coordinates))));
    return g;
  },
  hwy: fc => {
    const g = L.layerGroup();
    const w = () => { const z = map.getZoom(); return z < 11 ? [5, 2.4] : z < 13 ? [7, 3.6] : [10, 5.5]; };
    const cas = L.geoJSON(fc, {pane:'hwy', interactive:false, style: f => ({className:'hwy-case', weight: w()[0] * (f.properties.kind === 'city' ? .85 : 1)})});
    const core = L.geoJSON(fc, {pane:'hwy', style: f => ({className:'hwy-core ' + f.properties.kind, weight: w()[1] * (f.properties.kind === 'city' ? .85 : 1)}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => { cas.eachLayer(l => l.setStyle({weight: w()[0] * (l.feature.properties.kind === 'city' ? .85 : 1)})); core.eachLayer(l => l.setStyle({weight: w()[1] * (l.feature.properties.kind === 'city' ? .85 : 1)})); });
    g.addLayer(cas); g.addLayer(core);
    const SH = {'401':'401','400':'400','404':'404','409':'409','427':'427','QEW':'QEW','2A':'2A','DVP':'DVP','Gardiner':'Gardiner','Allen':'Allen Rd'};
    fc.features.forEach(f => {
      const parts = f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates;
      const longest = parts.reduce((a, b) => b.length > a.length ? b : a);
      const at = f.properties.route === '401' ? [.15, .5, .85] : [.5];
      at.forEach((t, i) => {
        const p = longest[Math.floor((longest.length - 1) * t)];
        const html = '<span class="shield ' + (f.properties.kind === 'city' ? 'city' : '') + (i ? ' minor' : '') + '">' + SH[f.properties.route] + '</span>';
        g.addLayer(L.marker(ll(p), {pane:'pts', interactive:false, keyboard:false, icon: L.divIcon({className:'', html, iconSize:null})}));
      });
    });
    return g;
  },
  subway: ([lines, stns]) => {
    const g = L.layerGroup();
    const w = () => { const z = map.getZoom(); return z < 11 ? 3 : z < 13 ? 4.5 : 6; };
    const lg = L.geoJSON(lines, {pane:'transit', style: f => ({className:'sub-line l' + f.properties.line, weight: w()}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => lg.eachLayer(l => l.setStyle({weight: w()})));
    g.addLayer(lg);
    const names = L.layerGroup();
    stns.features.forEach(f => {
      const x = f.properties.lines.length > 1, end = f.properties.terminus;
      const m = L.circleMarker(ll(f.geometry.coordinates), {pane:'pts', radius: x || end ? 5 : 3.5, className: 'stn' + (x ? ' x' : '') + (end ? ' end' : '')});
      hoverTip(m, f.properties.name + ' · Line ' + f.properties.lines.join(', '));
      m.on('click', e => inspect(e.latlng));
      g.addLayer(m);
      names.addLayer(L.tooltip({permanent:true, direction:'right', offset:[6,0], className:'lbl lbl-stn' + (f.properties.terminus ? ' end' : ''), interactive:false}).setLatLng(ll(f.geometry.coordinates)).setContent(f.properties.name));
    });
    g._names = names;
    return g;
  },
};
const FILES = {boroughs:'boroughs', areas:'areas', nbhd:'neighbourhoods', cultural:'cultural', wards:'wards', prov:'wards', fed:'federal', bia:'bia', hwy:'highways', subway:['subway_lines','subway_stations']};

/* ---------- panel ---------- */
const state = {};
const host = document.getElementById('layers');
GROUPS.forEach(([title, items]) => {
  const grp = document.createElement('div'); grp.className = 'grp';
  grp.innerHTML = '<h2>' + title + '</h2>';
  items.forEach(it => {
    const row = document.createElement('label'); row.className = 'row'; row.htmlFor = 'lyr-' + it.id;
    row.innerHTML = '<span class="sw ' + it.id + '">' + (it.swatch || '') + '</span><span class="tx"><b>' + it.name + '</b><span>' + it.note + '</span></span>' +
      '<input type="checkbox" id="lyr-' + it.id + '"' + (it.on ? ' checked' : '') + '><span class="tg" aria-hidden="true"></span>';
    grp.appendChild(row);
    row.querySelector('input').addEventListener('change', e => setLayer(it.id, e.target.checked));
    if (it.sub){
      const s = document.createElement('label'); s.className = 'sub';
      s.innerHTML = '<input type="checkbox" id="' + it.sub.id + '"' + (it.sub.on ? ' checked' : '') + '> ' + it.sub.label;
      grp.appendChild(s);
      s.querySelector('input').addEventListener('change', () => syncStnNames());
    }
    state[it.id] = !!it.on;
  });
  host.appendChild(grp);
});
function syncStnNames(){
  const L_ = layers.subway; if (!L_) return;
  const want = state.subway && document.getElementById('stnNames').checked;
  if (want && !map.hasLayer(L_._names)) L_._names.addTo(map);
  if (!want && map.hasLayer(L_._names)) map.removeLayer(L_._names);
}
const ORDER = ['boroughs','areas','bia','nbhd','fed','prov','wards','cultural','hwy','subway'];
function setLayer(id, on){
  state[id] = on;
  const lyr = layers[id]; if (!lyr) return;
  if (on) { lyr.addTo(map); } else { map.removeLayer(lyr); }
  if (id === 'subway') syncStnNames();
}
document.getElementById('allOff').addEventListener('click', () => {
  Object.keys(state).forEach(id => { const cb = document.getElementById('lyr-' + id); if (cb.checked){ cb.checked = false; setLayer(id, false); } });
});
const panel = document.getElementById('panel');
document.getElementById('ph').addEventListener('click', () => { if (matchMedia('(max-width:760px)').matches) panel.classList.toggle('collapsed'); });
if (matchMedia('(max-width:760px)').matches) panel.classList.add('collapsed');

/* ---------- What's here ---------- */
const here = document.getElementById('here');
let pin = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inspect(latlng, title){
  const x = latlng.lng, y = latlng.lat;
  const boro = hit(data.boroughs, x, y);
  if (!boro){ here.hidden = false; renderEmpty('That spot is outside the City of Toronto.'); return; }
  if (pin) pin.setLatLng(latlng); else pin = L.marker(latlng, {pane:'pin', interactive:false, keyboard:false, icon: L.divIcon({className:'', iconSize:[20, 20], iconAnchor:[10, 10], html:'<span class="pin"></span>'})}).addTo(map);
  const area = hit(data.areas, x, y), nb = hit(data.nbhd, x, y), ward = hit(data.wards, x, y), fed = hit(data.fed, x, y), bia = hit(data.bia, x, y);
  const near = (data.cultural ? data.cultural.features : []).map(f => [f, metres([x, y], f.geometry.coordinates)]).filter(a => a[1] < 650).sort((a, b) => a[1] - b[1]).slice(0, 2);
  const bn = boro.properties.name;
  const pills = [];
  if (area) pills.push(['var(' + AREA_VAR[area.properties.name] + ')', area.properties.name]);
  else pills.push(['var(' + BORO_VAR[bn] + ')', bn]);
  near.forEach(([f]) => pills.push(['var(--cult-enclave)', f.properties.name]));
  if (bia) pills.push(['var(--bia)', bia.properties.name + ' BIA']);
  if (fed) pills.push(['var(--fed)', 'Votes in ' + fed.properties.name]);
  const facts = [
    ['Former city', bn],
    ['Area', area ? area.properties.name : (bn === 'Old Toronto' ? '—' : 'Outside Old Toronto')],
    ['Neighbourhood', nb ? nb.properties.name + ' (#' + nb.properties.code + ')' : '—'],
    ['Known as', near.length ? near.map(a => a[0].properties.name).join(', ') : '—'],
    ['BIA', bia ? bia.properties.name + (bia.properties.since ? ' (since ' + bia.properties.since + ')' : '') : 'None'],
    ['City ward', ward ? 'Ward ' + ward.properties.num + ' · ' + ward.properties.name : '—'],
    ['Provincial', ward ? ward.properties.prov : '—'],
    ['Federal', fed ? fed.properties.name : '—'],
  ];
  here.hidden = false;
  here.innerHTML = '<div class="hh"><div><small>What’s here</small><strong>' + esc(title || (y.toFixed(4) + '° N, ' + Math.abs(x).toFixed(4) + '° W')) + '</strong></div><button type="button" aria-label="Close" id="hereX">×</button></div>' +
    '<div class="pills">' + pills.map(p => '<span class="pill"><i style="background:' + p[0] + '"></i>' + esc(p[1]) + '</span>').join('') + '</div>' +
    '<dl class="facts">' + facts.map(f => '<dt>' + f[0] + '</dt><dd>' + esc(f[1]) + '</dd>').join('') + '</dl>' +
    '<button type="button" class="more" id="hereMore">' + (here.classList.contains('open') ? 'Hide details' : 'Show all details') + '</button>';
  document.getElementById('hereX').onclick = closeHere;
  document.getElementById('hereMore').onclick = () => { here.classList.toggle('open'); document.getElementById('hereMore').textContent = here.classList.contains('open') ? 'Hide details' : 'Show all details'; };
}
function renderEmpty(msg){
  here.innerHTML = '<div class="hh"><div><small>What’s here</small><strong>Tap the map</strong></div><button type="button" aria-label="Close" id="hereX">×</button></div><div class="hint">' + esc(msg) + '</div>';
  document.getElementById('hereX').onclick = closeHere;
}
function closeHere(){ here.hidden = true; if (pin){ map.removeLayer(pin); pin = null; } }

/* ---------- Address search (OpenStreetMap Nominatim; one request per search, per its usage policy) ---------- */
const qf = document.getElementById('qf'), q = document.getElementById('q'), go = document.getElementById('go'), results = document.getElementById('results');
let lastSearch = 0;
function showResults(html){ results.innerHTML = html; results.hidden = !html; }
function placeLabel(r){
  const a = r.address || {};
  const street = a.road || a.pedestrian || a.footway || '';
  if (a.house_number && street) return a.house_number + ' ' + street;
  return r.name || street || r.display_name.split(',')[0];
}
function placeSub(r){
  const a = r.address || {};
  return [a.neighbourhood || a.suburb || a.quarter, a.postcode].filter(Boolean).join(' · ');
}
function choose(r){
  const latlng = L.latLng(+r.lat, +r.lon), name = placeLabel(r);
  showResults('');
  q.value = name;
  map.flyTo(latlng, Math.max(map.getZoom(), 15), {duration: .8});
  inspect(latlng, name);
}
qf.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || !data.boroughs) return;
  const wait = 1100 - (Date.now() - lastSearch);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastSearch = Date.now();
  go.disabled = true; go.textContent = '…';
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=ca&bounded=1' +
    '&viewbox=-79.64,43.86,-79.11,43.58&q=' + encodeURIComponent(text);
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 10000);
    const list = await fetch(url, {signal: ctl.signal, headers: {'Accept-Language': 'en'}}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    clearTimeout(timer);
    const inCity = list.filter(r => hit(data.boroughs, +r.lon, +r.lat));
    if (!inCity.length){
      showResults('<li class="msg">No match inside the City of Toronto for “' + esc(text) + '”. Try the full street name, like “789 Yonge Street”.</li>');
    } else if (inCity.length === 1){
      choose(inCity[0]);
    } else {
      window.__hits = inCity;
      showResults(inCity.map((r, i) => '<li><button type="button" data-i="' + i + '">' + esc(placeLabel(r)) + (placeSub(r) ? '<span>' + esc(placeSub(r)) + '</span>' : '') + '</button></li>').join(''));
      results.querySelectorAll('button').forEach(b => b.addEventListener('click', () => choose(window.__hits[+b.dataset.i])));
      results.querySelector('button').focus();
    }
  } catch (err){
    showResults('<li class="msg">Address search isn’t responding right now. Try again in a moment, or tap the map instead.</li>');
  } finally { go.disabled = false; go.textContent = 'Find'; }
});
q.addEventListener('keydown', e => { if (e.key === 'Escape'){ showResults(''); q.blur(); } });
q.addEventListener('input', () => { if (!q.value) showResults(''); });

/* ---------- load ---------- */
renderEmpty('Loading map data…');
Promise.all([get('base'), get('boroughs'), get('areas'), get('neighbourhoods'), get('cultural'), get('wards'), get('federal'), get('bia'), get('highways'), get('subway_lines'), get('subway_stations')])
.then(([base, boroughs, areas, nbhd, cultural, wards, fed, bia, hwy, sl, ss]) => {
  Object.assign(data, {boroughs, areas, nbhd, cultural, wards, fed, bia});
  buildBase(base);
  const src = {boroughs, areas, nbhd, cultural, wards, prov: wards, fed, bia, hwy, subway: [sl, ss]};
  ORDER.forEach(id => { layers[id] = BUILD[id](src[id]); });
  ORDER.forEach(id => { if (state[id]) layers[id].addTo(map); });
  syncStnNames();
  zoomClasses();
  inspect(L.latLng(43.67194, -79.38667), 'Toronto Reference Library (example)');
}).catch(err => { renderEmpty('The map data didn’t load (' + err.message + '). Reload the page to try again.'); });
})();
</script>
