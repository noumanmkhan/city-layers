<meta charset="utf-8">
<title>Toronto Layers</title>
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="description" content="A map of the City of Toronto with toggleable layers: former cities, Old Toronto areas, 158 neighbourhoods, known-as names, wards, ridings, BIAs, main streets, highways and rapid transit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/*LEAFLET_CSS*/
</style>
<style>
/* Layout: full-bleed map; a layer panel docked left (bottom sheet on phones); a "What's here" readout docked right. */
:root{
  /* page */
  --bg:#F4F3EE; --panel:#FFFFFF; --ink:#23262B; --ink-2:#5D6168; --ink-3:#8A8E95; --rule:#E2E0D8; --accent:#7A3EC8; --focus:#2F7FD8;
  /* map */
  --water:#CFE7F7; --land-out:#E6E3DA; --land-out-line:#C4C0B4; --land-far:#F2F1EC; --city:#FBFAF6; --city-line:#4A4E55; --muni-label:#8E8B82;
  /* former cities */
  --b-oldtoronto:#EE6E73; --b-york:#B9A5E6; --b-northyork:#95CA7E; --b-eastyork:#6BC4CF; --b-etobicoke:#F0A06E; --b-scarborough:#7DAFE0;
  /* old toronto areas */
  --a-downtown:#EE6E73; --a-midtown:#8FD6C0; --a-uptown:#F3A8CB; --a-westend:#F2CE5E; --a-eastend:#F6B98A;
  /* civic */
  --nbhd:#3D4148; --nbhd-fill:#3D4148; --ward:#7A3EC8; --prov:#B0306A; --fed:#1F6FB8; --bia:#E0791A; --cult:#23262B; --cult-enclave:#B0306A;
  /* transport */
  --st:#FFFFFF; --st-case:#BDB9AE; --hwy:#F7C548; --hwy-case:#3B3F45; --hwy-city:#B6B9BF; --shield:#C8102E; --shield-city:#2E6B3A;
  --l1:#FFC425; --l2:#00A64F; --l4:#A8518A; --l5:#F58426; --l6:#959595; --station:#FFFFFF;
  --pill-bg:#F1EFE8;
  --shield-etr:#1F5FA8; --go-ring:#3D4148; --go-ink:#2F4F3A; --go-a:#98002E; --go-b:#00853E; --go-c:#0099C7; --go-d:#FF0D00;
  --lm-sports:#C8102E; --lm-park:#2E8B57; --lm-music:#8E44AD; --lm-civic:#4A5A70; --lm-campus:#1F5FA8; --lm-culture:#D9730D;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(20,22,26,.08),0 8px 24px rgba(20,22,26,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171B; --panel:#1E2126; --ink:#ECEDEF; --ink-2:#AEB2B9; --ink-3:#7E838B; --rule:#30343B; --accent:#B892F0; --focus:#6CB2FF;
  --water:#13283A; --land-out:#24272D; --land-out-line:#3E434B; --land-far:#1A1C20; --city:#2A2D33; --city-line:#C9CCD2; --muni-label:#7E838B;
  --b-oldtoronto:#C2484E; --b-york:#7D68B8; --b-northyork:#5E9A48; --b-eastyork:#3B98A3; --b-etobicoke:#C7703F; --b-scarborough:#4C7FB5;
  --a-downtown:#C2484E; --a-midtown:#4FA88E; --a-uptown:#C26E96; --a-westend:#B8962E; --a-eastend:#C7844F;
  --nbhd:#D7DADF; --nbhd-fill:#D7DADF; --ward:#B892F0; --prov:#F07AAE; --fed:#6CB2FF; --bia:#F39A45; --cult:#ECEDEF; --cult-enclave:#F07AAE;
  --st:#4E545E; --st-case:#121417; --hwy:#E2B13A; --hwy-case:#0E1013; --hwy-city:#6E737B; --shield:#C8102E; --shield-city:#2E6B3A;
  --station:#1E2126; --pill-bg:#2A2D33; --go-ring:#C9CCD2; --go-ink:#B7D7C1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171B; --panel:#1E2126; --ink:#ECEDEF; --ink-2:#AEB2B9; --ink-3:#7E838B; --rule:#30343B; --accent:#B892F0; --focus:#6CB2FF;
  --water:#13283A; --land-out:#24272D; --land-out-line:#3E434B; --land-far:#1A1C20; --city:#2A2D33; --city-line:#C9CCD2; --muni-label:#7E838B;
  --b-oldtoronto:#C2484E; --b-york:#7D68B8; --b-northyork:#5E9A48; --b-eastyork:#3B98A3; --b-etobicoke:#C7703F; --b-scarborough:#4C7FB5;
  --a-downtown:#C2484E; --a-midtown:#4FA88E; --a-uptown:#C26E96; --a-westend:#B8962E; --a-eastend:#C7844F;
  --nbhd:#D7DADF; --nbhd-fill:#D7DADF; --ward:#B892F0; --prov:#F07AAE; --fed:#6CB2FF; --bia:#F39A45; --cult:#ECEDEF; --cult-enclave:#F07AAE;
  --st:#4E545E; --st-case:#121417; --hwy:#E2B13A; --hwy-case:#0E1013; --hwy-city:#6E737B; --shield:#C8102E; --shield-city:#2E6B3A;
  --station:#1E2126; --pill-bg:#2A2D33; --go-ring:#C9CCD2; --go-ink:#B7D7C1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--font)}
.leaflet-container :focus-visible{outline:2px solid var(--focus)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-bar{box-shadow:var(--shadow)!important;border:none!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:1000;top:16px;left:16px;bottom:16px;width:300px;display:flex;flex-direction:column;
  background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ph{padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px}
.ph .grab{display:none}
#layers{overflow:auto;padding:6px 10px 14px;flex:1;min-height:0}
.grp{margin-top:10px}
.grp h2{margin:8px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.row{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:9px;cursor:pointer;user-select:none}
.row:hover{background:var(--pill-bg)}
.row input{position:absolute;opacity:0;pointer-events:none}
.sw{flex:none;width:30px;height:22px;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:13.5px}
.tx span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.tg{flex:none;width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;margin-top:2px;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.row input:checked ~ .tg{background:var(--accent)}
.row input:checked ~ .tg::after{transform:translateX(14px)}
.row input:focus-visible ~ .tg{outline:2px solid var(--focus);outline-offset:2px}
.sub{margin:-4px 0 4px 48px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sub input{accent-color:var(--accent);margin:0}
.pf{padding:10px 18px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.pf button{font:inherit;color:var(--ink-2);background:none;border:1px solid var(--rule);border-radius:7px;padding:4px 9px;cursor:pointer}
.pf button:hover{color:var(--ink)}
.pf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;padding:2px;gap:2px}
.pf .seg button{border:none;border-radius:6px;padding:4px 8px;font-size:11.5px}
.pf .seg button[aria-checked="true"]{background:var(--pill-bg);color:var(--ink);font-weight:600}

/* swatches */
.sw.boroughs{background:conic-gradient(var(--b-etobicoke) 0 17%,var(--b-northyork) 0 34%,var(--b-scarborough) 0 51%,var(--b-york) 0 68%,var(--b-eastyork) 0 84%,var(--b-oldtoronto) 0)}
.sw.areas{background:linear-gradient(90deg,var(--a-westend) 0 20%,var(--a-downtown) 0 40%,var(--a-midtown) 0 60%,var(--a-uptown) 0 80%,var(--a-eastend) 0)}
.sw.nbhd{background:var(--city);background-image:linear-gradient(var(--nbhd) 1px,transparent 1px),linear-gradient(90deg,var(--nbhd) 1px,transparent 1px);background-size:9px 8px;background-position:3px 3px}
.sw.cultural{background:var(--city);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--cult);font-style:italic}
.sw.wards{background:var(--city);box-shadow:inset 0 0 0 2px var(--ward)}
.sw.prov{background:var(--city);background-image:repeating-linear-gradient(90deg,var(--prov) 0 4px,transparent 4px 7px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 50%}
.sw.fed{background:var(--city);box-shadow:inset 0 0 0 2px var(--fed)}
.sw.bia{background:color-mix(in srgb,var(--bia) 45%,var(--city))}
.sw.streets{background:var(--city);background-image:linear-gradient(var(--st-case),var(--st-case)),linear-gradient(var(--st),var(--st));background-size:100% 5px,100% 3px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.hwy{background:var(--city);background-image:linear-gradient(var(--hwy-case),var(--hwy-case)),linear-gradient(var(--hwy),var(--hwy));background-size:100% 6px,100% 2px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.landmarks{background:var(--panel);display:grid;place-items:center;color:var(--lm-culture)}
.sw.landmarks svg{width:14px;height:14px}
.sw.subway{background:linear-gradient(var(--l1) 0 25%,var(--l2) 0 50%,var(--l5) 0 75%,var(--l4) 0)}

/* ---------- map styling (CSS overrides Leaflet's SVG attributes, so both themes work) ---------- */
.base-out{fill:var(--land-out);fill-opacity:1;stroke:var(--land-out-line);stroke-width:1}
.base-far{fill:var(--land-far);fill-opacity:1;stroke:none}
.base-city{fill:var(--city);fill-opacity:1;stroke:var(--city-line);stroke-width:1.6}
.boro{fill-opacity:.55;stroke:var(--city);stroke-width:2}
.boro.old-toronto{fill:var(--b-oldtoronto)} .boro.york{fill:var(--b-york)} .boro.north-york{fill:var(--b-northyork)}
.boro.east-york{fill:var(--b-eastyork)} .boro.etobicoke{fill:var(--b-etobicoke)} .boro.scarborough{fill:var(--b-scarborough)}
.area{fill-opacity:.6;stroke:var(--city);stroke-width:2}
.area.downtown{fill:var(--a-downtown)} .area.midtown{fill:var(--a-midtown)} .area.uptown{fill:var(--a-uptown)}
.area.west-end{fill:var(--a-westend)} .area.east-end{fill:var(--a-eastend)}
.nbhd{fill:var(--nbhd-fill);fill-opacity:0;stroke:var(--nbhd);stroke-width:.9;stroke-opacity:.7}
.nbhd:hover{fill-opacity:.12}
.ward{fill:var(--ward);fill-opacity:0;stroke:var(--ward);stroke-width:2.2}
.ward:hover{fill-opacity:.08}
.prov{fill:var(--prov);fill-opacity:0;stroke:var(--prov);stroke-width:2;stroke-dasharray:6 4}
.prov:hover{fill-opacity:.08}
.fed{fill:var(--fed);fill-opacity:0;stroke:var(--fed);stroke-width:2.2;stroke-dasharray:1 0}
.fed:hover{fill-opacity:.08}
.bia{fill:var(--bia);fill-opacity:.45;stroke:var(--bia);stroke-width:1.2}
.bia:hover{fill-opacity:.7}
.st-case{stroke:var(--st-case);fill:none;stroke-linecap:round;stroke-linejoin:round}
.st-core{stroke:var(--st);fill:none;stroke-linecap:round;stroke-linejoin:round}
#map:not(.z12) .st-case.minor,#map:not(.z12) .st-core.minor{display:none}
.st-lbl{position:absolute;left:0;top:0;display:block;white-space:nowrap;pointer-events:none;font:600 11.5px/1 var(--font);color:var(--ink);
  text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.st-lbl.minor{font-weight:500;font-size:10.5px;color:var(--ink-2)}
.hwy-case{stroke:var(--hwy-case);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy-core{stroke:var(--hwy);fill:none;stroke-linecap:round;stroke-linejoin:round}
.sub-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.sub-line.l1{stroke:var(--l1)} .sub-line.l2{stroke:var(--l2)} .sub-line.l4{stroke:var(--l4)} .sub-line.l5{stroke:var(--l5)} .sub-line.l6{stroke:var(--l6)}
.stn{fill:var(--station);stroke:var(--ink);stroke-width:1.5}
.stn.x{stroke-width:2.2}
.pin{display:block;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 28%,transparent),0 2px 8px rgba(0,0,0,.4)}

/* labels */
.leaflet-tooltip.lbl{background:none;border:none;box-shadow:none;padding:0;color:var(--ink);font-family:var(--font);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.leaflet-tooltip.lbl::before{display:none}
.lbl-boro{font-size:15px;font-weight:800;letter-spacing:-.01em}
.lbl-area{font-size:13px;font-weight:700}
.lbl-nbhd{font-size:10.5px;font-weight:500;color:var(--ink-2)!important;max-width:120px;white-space:normal!important;text-align:center;line-height:1.15}
.lbl-cult{font-size:11.5px;font-weight:600;font-style:italic;color:var(--cult)!important}
.lbl-cult.enclave{color:var(--cult-enclave)!important}
.lbl-ward{font-size:11px;font-weight:700;color:var(--ward)!important}
.lbl-prov{font-size:11px;font-weight:700;color:var(--prov)!important}
.lbl-fed{font-size:11px;font-weight:700;color:var(--fed)!important}
.lbl-bia{font-size:10px;font-weight:600;color:var(--bia)!important}
.lbl-stn{font-size:10px;font-weight:600}
.lbl-stn.end{font-size:11px;font-weight:700}
.stn.end{stroke-width:2.6}
.lm{display:flex;align-items:center;gap:6px;white-space:nowrap;transform:translate(-11px,-11px)}
.lm i{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--lm);box-shadow:0 0 0 1.5px var(--lm),0 1px 3px rgba(0,0,0,.25)}
.lm i svg{width:13px;height:13px}
.lm b{font:700 11.5px/1.15 var(--font);color:var(--ink);text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.clash{visibility:hidden!important}
.lm.sports{--lm:var(--lm-sports)} .lm.park{--lm:var(--lm-park)} .lm.music{--lm:var(--lm-music)} .lm.civic{--lm:var(--lm-civic)}
.lm.campus{--lm:var(--lm-campus)} .lm.culture{--lm:var(--lm-culture)} .lm.airport{--lm:var(--ink)}
#map:not(.z11) .lm.t1,#map:not(.z13) .lm.t2,#map:not(.z13) .lm.t1 b,#map:not(.z14) .lm.t2 b{display:none}
.lbl-muni{font-size:13px;font-weight:500;font-style:italic;color:var(--muni-label)!important;text-shadow:none}
.lbl-region{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muni-label)!important;text-shadow:none}
.lbl-lake{font-size:24px;font-weight:600;font-style:italic;color:color-mix(in srgb,var(--water) 40%,#2F7FD8)!important;text-shadow:none;letter-spacing:.02em}
.shield{display:grid;place-items:center;height:18px;min-width:26px;padding:0 4px;border-radius:5px;background:var(--shield);color:#fff;
  font:700 10.5px/1 var(--font);box-shadow:0 0 0 1.5px #fff;white-space:nowrap}
.shield.city{background:var(--shield-city)}
.shield.etr{background:var(--shield-etr)}
.go-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.go-stn{fill:var(--station);stroke:var(--go-ring);stroke-width:1.6}
.go-stn.hub{stroke-width:2.6}
.lbl-go{font-size:10px;font-weight:600;color:var(--go-ink)!important}
.lbl-go.end{font-size:11px;font-weight:700}
.sw.go{background:linear-gradient(var(--go-a) 0 25%,var(--go-b) 0 50%,var(--go-c) 0 75%,var(--go-d) 0)}
.gta-note{padding:0 16px 12px;color:var(--ink-2);font-size:12.5px}
.hover-tip{background:var(--panel)!important;color:var(--ink)!important;border:1px solid var(--rule)!important;box-shadow:var(--shadow)!important;font:600 12px/1.3 var(--font)!important;border-radius:7px!important;padding:4px 8px!important}
.hover-tip::before{display:none}
/* zoom-gated labels */
#map:not(.z11) .lbl-area,#map:not(.z11) .lbl-ward,#map:not(.z11) .lbl-prov,#map:not(.z11) .lbl-fed{display:none}
#map.z10 .lbl-region,#map:not(.z10) .lbl-muni,#map:not(.z10) .lbl-boro,#map:not(.z10) .shield:not(.gta),#map:not(.z12) .lbl-go:not(.end),#map:not(.z12) .go-stn:not(.end):not(.hub),#map:not(.z10) .poi b,#map:not(.z10) .lake-near,#map.z10 .lake-far{display:none}
#map:not(.z12) .lbl-cult,#map:not(.z12) .shield.minor{display:none}
#map:not(.z13) .lbl-nbhd,#map:not(.z13) .lbl-stn:not(.end){display:none}
#map:not(.z11) .lbl-stn.end{display:none}
#map:not(.z14) .lbl-bia{display:none}
#map.z13 .lbl-boro{opacity:.35}

/* ---------- readout ---------- */
#side{position:absolute;z-index:1000;top:16px;right:16px;width:320px;display:flex;flex-direction:column;gap:10px}
#here{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#search{position:relative;background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
#search form{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#search svg{flex:none;width:16px;height:16px;color:var(--ink-3)}
#q{flex:1;min-width:0;font:500 14px/1.2 var(--font);color:var(--ink);background:none;border:none;outline:none;padding:8px 0}
#q::placeholder{color:var(--ink-3)}
#search:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--focus)}
#go{flex:none;font:600 12.5px/1 var(--font);color:#fff;background:var(--accent);border:none;border-radius:9px;padding:9px 12px;cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
#results{list-style:none;margin:0;padding:4px 6px 6px;border-top:1px solid var(--rule)}
#results li button{display:block;width:100%;text-align:left;font:500 13px/1.3 var(--font);color:var(--ink);background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer}
#results li button:hover,#results li button:focus-visible{background:var(--pill-bg);outline:none}
#results li button span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
#results .msg{padding:8px 10px;color:var(--ink-2);font-size:12.5px}
.credit{padding:0 16px 8px;font-size:10.5px;color:var(--ink-3)}
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.hh small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hh strong{display:block;font-size:15px;font-weight:700;margin-top:2px}
.hh button{flex:none;font:inherit;font-size:18px;line-height:1;width:28px;height:28px;border-radius:7px;border:none;background:var(--pill-bg);color:var(--ink-2);cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--pill-bg);font-weight:600;font-size:12.5px}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
dl.facts{margin:0;padding:10px 16px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0;font-weight:500;min-width:0}
.more{display:none;width:100%;font:600 12px/1 var(--font);color:var(--ink-2);background:none;border:none;border-top:1px solid var(--rule);padding:9px;cursor:pointer}

</style>

<div id="app">

  <aside id="panel" aria-label="Map layers">
    <div class="ph" id="ph">
      <div class="grab" aria-hidden="true"></div>
      <h1>Toronto Layers</h1>
      <p>Turn layers on and off. Search an address or tap anywhere on the map to see every boundary that spot falls inside.</p>
    </div>
    <div id="layers"></div>
    <div class="pf">
      <button type="button" id="allOff">Hide all layers</button>
      <div class="seg" role="radiogroup" aria-label="Colour theme">
        <button type="button" role="radio" data-theme-choice="auto" title="Match your device">Auto</button>
        <button type="button" role="radio" data-theme-choice="light">Light</button>
        <button type="button" role="radio" data-theme-choice="dark">Dark</button>
      </div>
    </div>
  </aside>

  <div id="side">
    <div id="search" role="search">
      <form id="qf" autocomplete="off">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5" stroke-linecap="round"/></svg>
        <label for="q" class="vh">Search a Toronto address</label>
        <input id="q" type="search" placeholder="Search a Toronto address" enterkeyhint="search">
        <button id="go" type="submit">Find</button>
      </form>
      <ul id="results" hidden></ul>
    </div>
    <section id="here" aria-live="polite"></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.js"></script>
<script>
(() => {
const DATA = 'data/';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

const GROUPS = [
  ['Places', [
    {id:'boroughs', name:'Former cities', note:'The 6 municipalities merged in 1998', on:true},
    {id:'areas', name:'Old Toronto areas', note:'Downtown, Midtown, Uptown, West End, East End'},
    {id:'nbhd', name:'Neighbourhoods', note:'The City’s 158 official neighbourhoods'},
    {id:'cultural', name:'Known-as names', note:'King West, Little Italy, the Junction…', swatch:'Aa'},
    {id:'landmarks', name:'Landmarks', note:'Arenas, big parks, music venues, campuses', on:true, swatch:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>'},
  ]],
  ['Representation', [
    {id:'wards', name:'City wards', note:'25 wards, one councillor each'},
    {id:'prov', name:'Provincial ridings', note:'25 MPPs · same lines as the wards'},
    {id:'fed', name:'Federal ridings', note:'24 MPs · 2023 boundaries'},
    {id:'bia', name:'Business Improvement Areas', note:'85 BIAs'},
  ]],
  ['Getting around', [
    {id:'streets', name:'Main streets', note:'Arterials like King, Queen, Eglinton, Don Mills', on:true},
    {id:'hwy', name:'Highways', note:'400-series, QEW, 407 ETR across the GTA; DVP, Gardiner, Allen', on:true},
    {id:'go', name:'GO Transit trains', note:'7 GO lines and UP Express to Pearson', on:true},
    {id:'subway', name:'Subway & LRT', note:'Lines 1, 2, 4, 5 and 6', on:true, sub:{id:'stnNames', label:'Show station names', on:true}},
  ]],
];

const map = L.map('map', {zoomSnap:.25, zoomDelta:.5, minZoom:8.5, maxZoom:17, attributionControl:true, zoomControl:true, preferCanvas:false});
map.attributionControl.setPrefix(false);
window.torontoMap = map;
map.attributionControl.addAttribution('Boundaries & streets: City of Toronto Open Data · Ridings: Elections Canada / Elections Ontario via Open North · Transit: TTC GTFS · Neighbouring municipalities & address search: © OpenStreetMap contributors via Nominatim');
const CITY_BOUNDS = L.latLngBounds([43.581,-79.639],[43.855,-79.115]);
const wide = () => !matchMedia('(max-width:760px)').matches;
map.fitBounds(CITY_BOUNDS, wide() ? {paddingTopLeft:[330,20], paddingBottomRight:[350,20]} : {paddingTopLeft:[0,150], paddingBottomRight:[0,90]});
map.setMaxBounds(L.latLngBounds([43.05,-80.6],[44.75,-78.2]));  // the GTA plus a margin

const panes = [['base',200],['fill',350],['lines',420],['streets',400],['civic',430],['hwy',450],['rail',460],['transit',470],['stlbl',475],['pts',480],['pin',620]];
panes.forEach(([n,z]) => { map.createPane(n); map.getPane(n).style.zIndex = z; });
map.getPane('base').style.pointerEvents = 'none';
map.getPane('stlbl').style.pointerEvents = 'none';

const layers = {}; const data = {};
const get = f => fetch(DATA + f + '.geojson').then(r => { if (!r.ok) throw new Error(f); return r.json(); });

function zoomClasses(){
  const z = map.getZoom(), el = map.getContainer();
  [10,11,12,13,14].forEach(t => el.classList.toggle('z'+t, z >= t - .01));
}
map.on('zoomend', zoomClasses); zoomClasses();

/* Label declutter: after each move, place labels in priority order and hide any that would overlap
   a label already placed. Icons stay; hovering an icon still shows its name. */
const LABEL_PRIORITY = ['.lm.t1 b', '.lm.t2 b', '.lbl-stn.end', '.lbl-go.end', '.shield', '.lbl-stn', '.lbl-go', '.lbl-cult', '.lbl-area', '.lbl-nbhd', '.lbl-ward, .lbl-prov, .lbl-fed', '.lbl-bia'];
let declutterQueued = false;
function declutter(){
  declutterQueued = false;
  const box = map.getContainer().getBoundingClientRect(), kept = [], seen = new Set();
  const el = map.getContainer();
  el.querySelectorAll('.clash').forEach(n => n.classList.remove('clash'));
  LABEL_PRIORITY.forEach(sel => el.querySelectorAll(sel).forEach(n => {
    if (seen.has(n)) return;  // e.g. a line-end label matches both '.lbl-stn.end' and '.lbl-stn'
    seen.add(n);
    const r = n.getBoundingClientRect();
    if (!r.width || r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom) return;
    const pad = 2;
    if (kept.some(k => r.left < k.right + pad && r.right > k.left - pad && r.top < k.bottom + pad && r.bottom > k.top - pad)) n.classList.add('clash');
    else kept.push(r);
  }));
}
function queueDeclutter(){ if (!declutterQueued){ declutterQueued = true; requestAnimationFrame(() => requestAnimationFrame(declutter)); } }
map.on('zoomend moveend layeradd layerremove', queueDeclutter);

function label(text, cls, latlng){
  return L.tooltip({permanent:true, direction:'center', className:'lbl ' + cls, pane:'tooltipPane', interactive:false}).setLatLng(latlng).setContent(text);
}
const ll = p => [p[1], p[0]];
function hoverTip(layer, text){ layer.bindTooltip(text, {sticky:true, className:'hover-tip', direction:'top', offset:[0,-8]}); }

function polyLayer(fc, opts){
  const g = L.layerGroup();
  const geo = L.geoJSON(fc, {pane: opts.pane || 'fill', style: f => ({className: opts.cls(f), weight: 1}),
    onEachFeature: (f, lyr) => { if (opts.hover) hoverTip(lyr, opts.hover(f)); lyr.on('click', e => inspect(e.latlng)); }});
  g.addLayer(geo);
  if (opts.label) fc.features.forEach(f => { const t = opts.label(f); if (t) g.addLayer(label(t, opts.lcls(f), ll(f.properties.lp))); });
  return g;
}

/* ---------- geometry helpers for "What's here" ---------- */
function inRing(x, y, r){ let ins = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1]; if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins = !ins; } return ins; }
function inPoly(x, y, c){ if (!inRing(x, y, c[0])) return false; for (let k = 1; k < c.length; k++) if (inRing(x, y, c[k])) return false; return true; }
function contains(geom, x, y){ if (geom.type === 'Polygon') return inPoly(x, y, geom.coordinates); if (geom.type === 'MultiPolygon') return geom.coordinates.some(c => inPoly(x, y, c)); return false; }
function hit(fc, x, y){ return fc ? fc.features.find(f => contains(f.geometry, x, y)) : null; }
function metres(a, b){ const k = Math.PI/180, dx = (a[0]-b[0])*k*Math.cos(a[1]*k)*6371000, dy = (a[1]-b[1])*k*6371000; return Math.hypot(dx, dy); }

/* ---------- build layers ---------- */
const BORO_ORDER = ['Etobicoke','York','North York','East York','Old Toronto','Scarborough'];
const AREA_VAR = {'Downtown':'--a-downtown','Midtown':'--a-midtown','Uptown':'--a-uptown','West End':'--a-westend','East End':'--a-eastend'};
const BORO_VAR = {'Old Toronto':'--b-oldtoronto','York':'--b-york','North York':'--b-northyork','East York':'--b-eastyork','Etobicoke':'--b-etobicoke','Scarborough':'--b-scarborough'};

function buildBase(fc, regions){
  const g = L.geoJSON(fc, {pane:'base', interactive:false, style: f => ({className: {city:'base-city', neighbour:'base-out', outside:'base-far'}[f.properties.kind]})});
  g.addTo(map);
  fc.features.filter(f => f.properties.kind === 'neighbour').forEach(f => label(f.properties.name, 'lbl-muni', ll(f.properties.lp)).addTo(map));
  regions.features.forEach(f => label(f.properties.name, 'lbl-region', ll(f.geometry.coordinates)).addTo(map));
  label('Lake Ontario', 'lbl-lake lake-near', [43.585, -79.40]).addTo(map);
  label('Lake Ontario', 'lbl-lake lake-far', [43.45, -78.75]).addTo(map);
  map.on('click', e => inspect(e.latlng));
}

const GLYPH = {
  sports: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2.2a7.8 7.8 0 0 1 7.2 4.8H4.8A7.8 7.8 0 0 1 12 4.2zM4.8 15h14.4a7.8 7.8 0 0 1-14.4 0z"/>',
  park: '<path d="M12 2 6.5 9.5h3L5 16h6v6h2v-6h6l-4.5-6.5h3z"/>',
  music: '<path d="M20 2 8 4.3v11.1A3.5 3.5 0 1 0 10 18.5V9.2l8-1.5v5.7a3.5 3.5 0 1 0 2 3.1z"/>',
  civic: '<path d="M12 1.5 2 6.5V9h20V6.5zM4 10.5v7h3v-7zm6.5 0v7h3v-7zm6.5 0v7h3v-7zM2 19v2.5h20V19z"/>',
  campus: '<path d="M12 3 1 9l11 6 9-4.9V16h2V9zM5 13.2V17l7 4 7-4v-3.8L12 17z"/>',
  culture: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
  airport: '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>',
};
const svg = d => '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + d + '</svg>';

const BUILD = {
  go: ([lines, stns]) => {
    const g = L.layerGroup();
    // Lines that share track near Union fan out sideways as you zoom in (offset in screen pixels).
    const gap = () => { const z = map.getZoom(); return z < 11 ? 0 : z < 12 ? 2 : z < 13 ? 3 : 4; };
    const w = () => { const z = map.getZoom(); return z < 11 ? 2.2 : z < 13 ? 3 : 3.5; };
    const segs = lines.features.map(f => {
      const pl = L.polyline(f.geometry.coordinates.map(ll), {pane:'rail', className:'go-line', color: f.properties.color, weight: w(), offset: f.properties.offset * gap()});
      hoverTip(pl, f.properties.name + (f.properties.line === 'UP' ? ' (Union \u2013 Pearson)' : ' line \u00b7 Union \u2013 ' + f.properties.to));
      pl.on('click', e => inspect(e.latlng));
      g.addLayer(pl); return [pl, f];
    });
    map.on('zoomend', () => segs.forEach(([pl, f]) => { pl.setStyle({weight: w()}); if (pl.setOffset) pl.setOffset(f.properties.offset * gap()); }));
    // A station is a line end if it is the last stop on any line.
    const ends = lines.features.map(f => f.geometry.coordinates[f.geometry.coordinates.length - 1]);
    stns.features.forEach(f => {
      const c = f.geometry.coordinates, p = f.properties;
      const end = ends.some(e => Math.abs(e[0] - c[0]) < .01 && Math.abs(e[1] - c[1]) < .008);
      const m = L.circleMarker(ll(c), {pane:'pts', radius: p.hub ? 6 : end ? 4.5 : 3.5, className: 'go-stn' + (p.hub ? ' hub' : '') + (end ? ' end' : '')});
      hoverTip(m, p.name + ' \u00b7 ' + p.lines.join(', '));
      m.on('click', e => inspect(e.latlng));
      g.addLayer(m);
      g.addLayer(L.tooltip({permanent:true, direction:'right', offset:[6, 0], className:'lbl lbl-go' + (end || p.hub ? ' end' : ''), interactive:false}).setLatLng(ll(c)).setContent(esc(p.name)));
    });
    return g;
  },
  landmarks: fc => {
    const g = L.layerGroup();
    fc.features.forEach(f => {
      const p = f.properties;
      const m = L.marker(ll(f.geometry.coordinates), {pane:'pts', keyboard:false, riseOnHover:true,
        icon: L.divIcon({className:'', iconSize:[0, 0], html:'<span class="lm ' + p.cat + ' t' + p.tier + '"><i>' + svg(GLYPH[p.cat]) + '</i><b>' + esc(p.name) + '</b></span>'})});
      hoverTip(m, p.name + ' \u00b7 ' + p.catLabel);
      m.on('click', () => goTo(L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]), p.name, false));
      g.addLayer(m);
    });
    return g;
  },
  boroughs: fc => polyLayer(fc, {cls: f => 'boro ' + slug(f.properties.name), label: f => f.properties.name, lcls: () => 'lbl-boro', hover: f => f.properties.name}),
  areas: fc => polyLayer(fc, {cls: f => 'area ' + slug(f.properties.name), label: f => f.properties.name, lcls: () => 'lbl-area', hover: f => f.properties.name}),
  nbhd: fc => polyLayer(fc, {pane:'lines', cls: () => 'nbhd', label: f => f.properties.name, lcls: () => 'lbl-nbhd', hover: f => f.properties.name + ' · #' + f.properties.code}),
  wards: fc => polyLayer(fc, {pane:'civic', cls: () => 'ward', label: f => 'Ward ' + f.properties.num, lcls: () => 'lbl-ward', hover: f => 'Ward ' + f.properties.num + ' · ' + f.properties.name}),
  prov: fc => polyLayer(fc, {pane:'civic', cls: () => 'prov', label: f => f.properties.prov, lcls: () => 'lbl-prov', hover: f => 'Provincial: ' + f.properties.prov}),
  fed: fc => polyLayer(fc, {pane:'civic', cls: () => 'fed', label: f => f.properties.name, lcls: () => 'lbl-fed', hover: f => 'Federal: ' + f.properties.name}),
  bia: fc => polyLayer(fc, {pane:'civic', cls: () => 'bia', label: f => f.properties.name, lcls: () => 'lbl-bia', hover: f => f.properties.name + ' BIA'}),
  cultural: fc => {
    const g = L.layerGroup();
    fc.features.forEach(f => g.addLayer(label(f.properties.name, 'lbl-cult' + (f.properties.kind === 'enclave' ? ' enclave' : ''), ll(f.geometry.coordinates))));
    return g;
  },
  streets: fc => {
    // Arterial roads, with names laid along the line. Labels are re-placed after every
    // move so they never overlap each other; majors win over minors, longer streets first.
    const g = L.layerGroup(), labels = L.layerGroup();
    const w = () => { const z = map.getZoom(); return z < 11 ? [2, 1] : z < 12 ? [3, 1.6] : z < 13 ? [4.2, 2.6] : z < 14 ? [6, 4] : [8, 5.6]; };
    const k = f => f.properties.cls === 'major' ? 1 : .75;
    const cas = L.geoJSON(fc, {pane:'streets', interactive:false, style: f => ({className:'st-case ' + f.properties.cls, weight: w()[0] * k(f)})});
    const core = L.geoJSON(fc, {pane:'streets', style: f => ({className:'st-core ' + f.properties.cls, weight: w()[1] * k(f)}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => { cas.eachLayer(l => l.setStyle({weight: w()[0] * k(l.feature)})); core.eachLayer(l => l.setStyle({weight: w()[1] * k(l.feature)})); });
    g.addLayer(cas); g.addLayer(core); g.addLayer(labels);
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const streets = fc.features.map(f => {
      const parts = (f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates).map(p => p.map(c => L.latLng(c[1], c[0])));
      return {name: f.properties.name, cls: f.properties.cls, parts: parts.map(p => ({pts: p, b: L.latLngBounds(p)}))};
    });
    const ctx = document.createElement('canvas').getContext('2d');
    const rect = (x, y, hw, hh, r) => ({x, y, hw, hh, ax: [[Math.cos(r), Math.sin(r)], [-Math.sin(r), Math.cos(r)]]});
    const overlap = (A, B) => [...A.ax, ...B.ax].every(([ux, uy]) => {
      const ext = R => R.hw * Math.abs(R.ax[0][0] * ux + R.ax[0][1] * uy) + R.hh * Math.abs(R.ax[1][0] * ux + R.ax[1][1] * uy);
      return Math.abs((B.x - A.x) * ux + (B.y - A.y) * uy) < ext(A) + ext(B);
    });
    const pointAt = (px, d, t) => { let i = 1; while (i < d.length - 1 && d[i] < t) i++; const s = (t - d[i-1]) / ((d[i] - d[i-1]) || 1); return L.point(px[i-1].x + (px[i].x - px[i-1].x) * s, px[i-1].y + (px[i].y - px[i-1].y) * s); };
    function place(){
      labels.clearLayers();
      const z = map.getZoom();
      if (!map.hasLayer(g) || z < 12) return;
      const size = map.getSize(), view = map.getBounds(), boxes = [], seen = {}, fam = getComputedStyle(document.body).fontFamily;
      const SP = z < 13 ? 420 : z < 14 ? 340 : 280;
      // Keep clear of other labels, shields and the panels floating over the map.
      const mr = map.getContainer().getBoundingClientRect();
      document.querySelectorAll('#search, #here, #panel, .leaflet-tooltip.lbl, .shield, .lm i, .lm b, .stn, .leaflet-pin-pane > *').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.width && r.height) boxes.push(rect((r.left + r.right) / 2 - mr.left, (r.top + r.bottom) / 2 - mr.top, r.width / 2 + 3, r.height / 2 + 3, 0));
      });
      let count = 0;
      for (const s of streets){
        if ((s.cls === 'minor' && z < 13) || count >= 90) continue;
        ctx.font = (s.cls === 'major' ? '600 11.5px ' : '500 10.5px ') + fam;
        const tw = ctx.measureText(s.name).width + 8, th = s.cls === 'major' ? 15 : 14;
        const mine = seen[s.name] || (seen[s.name] = []);
        for (const part of s.parts){
          if (!view.intersects(part.b)) continue;
          const px = part.pts.map(p => map.latLngToContainerPoint(p));
          const d = [0]; for (let i = 1; i < px.length; i++) d.push(d[i-1] + px[i].distanceTo(px[i-1]));
          const total = d[d.length-1];
          if (total < tw * 1.3) continue;
          for (let at = Math.max(tw / 2, Math.min(SP / 2, total / 2)); at + tw / 2 <= total; at += 40){
            const a = pointAt(px, d, at - tw / 2), b = pointAt(px, d, at + tw / 2), c0 = pointAt(px, d, at);
            if (c0.x < 20 || c0.y < 20 || c0.x > size.x - 20 || c0.y > size.y - 20) continue;
            if (a.distanceTo(b) < tw * .94) continue;               // too curvy here
            if (mine.some(p => p.distanceTo(c0) < SP)) continue;     // same street labelled nearby
            let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
            if (ang > 90) ang -= 180; if (ang < -90) ang += 180;     // keep text upright
            const r = ang * Math.PI / 180;
            // On the street if there's room, otherwise just beside it (e.g. where a subway runs along it).
            let c = null, box;
            for (const off of [0, th / 2 + 9, -(th / 2 + 9)]){
              const q = L.point(c0.x - Math.sin(r) * off, c0.y + Math.cos(r) * off);
              const bx = rect(q.x, q.y, tw / 2, th / 2, r);
              if (!boxes.some(o => overlap(o, bx))) { c = q; box = bx; break; }
            }
            if (!c) continue;
            boxes.push(box); mine.push(c0); count++;
            labels.addLayer(L.marker(map.containerPointToLatLng(c), {pane:'stlbl', interactive:false, keyboard:false,
              icon: L.divIcon({className:'', iconSize:null, html:'<span class="st-lbl ' + s.cls + '" style="transform:translate(-50%,-50%) rotate(' + ang.toFixed(1) + 'deg)">' + esc(s.name) + '</span>'})}));
          }
        }
      }
    }
    map.on('moveend', place); g.on('add', () => setTimeout(place));
    return g;
  },
  hwy: ([fc, gta, gtaShields]) => {
    const g = L.layerGroup();
    const w = () => { const z = map.getZoom(); return z < 11 ? [5, 2.4] : z < 13 ? [7, 3.6] : [10, 5.5]; };
    const cas = L.geoJSON(fc, {pane:'hwy', interactive:false, style: f => ({className:'hwy-case', weight: w()[0]})});
    const core = L.geoJSON(fc, {pane:'hwy', style: f => ({className:'hwy-core ' + f.properties.kind, weight: w()[1]}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => { cas.eachLayer(l => l.setStyle({weight: w()[0]})); core.eachLayer(l => l.setStyle({weight: w()[1]})); });
    g.addLayer(cas); g.addLayer(core);
    // Beyond the city limits (OpenStreetMap): same look, shields stay visible when zoomed out to the GTA.
    const gcas = L.geoJSON(gta, {pane:'hwy', interactive:false, style: () => ({className:'hwy-case', weight: w()[0]})});
    const gcore = L.geoJSON(gta, {pane:'hwy', style: () => ({className:'hwy-core', weight: w()[1]}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => { gcas.eachLayer(l => l.setStyle({weight: w()[0]})); gcore.eachLayer(l => l.setStyle({weight: w()[1]})); });
    g.addLayer(gcas); g.addLayer(gcore);
    gtaShields.features.forEach(f => {
      const p = f.properties, html = '<span class="shield gta' + (p.toll ? ' etr' : '') + '">' + (p.toll ? '407 ETR' : p.route) + '</span>';
      g.addLayer(L.marker(ll(f.geometry.coordinates), {pane:'pts', interactive:false, keyboard:false, icon: L.divIcon({className:'', html, iconSize:null})}));
    });
    const SH = {'401':'401','400':'400','404':'404','409':'409','427':'427','QEW':'QEW','2A':'2A','DVP':'DVP','Gardiner':'Gardiner','Allen':'Allen Rd'};
    fc.features.forEach(f => {
      const parts = f.geometry.type === 'LineString' ? [f.geometry.coordinates] : f.geometry.coordinates;
      const longest = parts.reduce((a, b) => b.length > a.length ? b : a);
      const at = f.properties.route === '401' ? [.15, .5, .85] : [.5];
      at.forEach((t, i) => {
        const p = longest[Math.floor((longest.length - 1) * t)];
        const html = '<span class="shield ' + (f.properties.kind === 'city' ? 'city' : '') + (i ? ' minor' : '') + '">' + SH[f.properties.route] + '</span>';
        g.addLayer(L.marker(ll(p), {pane:'pts', interactive:false, keyboard:false, icon: L.divIcon({className:'', html, iconSize:null})}));
      });
    });
    return g;
  },
  subway: ([lines, stns]) => {
    const g = L.layerGroup();
    const w = () => { const z = map.getZoom(); return z < 11 ? 3 : z < 13 ? 4.5 : 6; };
    const lg = L.geoJSON(lines, {pane:'transit', style: f => ({className:'sub-line l' + f.properties.line, weight: w()}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => lg.eachLayer(l => l.setStyle({weight: w()})));
    g.addLayer(lg);
    const names = L.layerGroup();
    stns.features.forEach(f => {
      const x = f.properties.lines.length > 1, end = f.properties.terminus;
      const m = L.circleMarker(ll(f.geometry.coordinates), {pane:'pts', radius: x || end ? 5 : 3.5, className: 'stn' + (x ? ' x' : '') + (end ? ' end' : '')});
      hoverTip(m, f.properties.name + ' · Line ' + f.properties.lines.join(', '));
      m.on('click', e => inspect(e.latlng));
      g.addLayer(m);
      names.addLayer(L.tooltip({permanent:true, direction:'right', offset:[6,0], className:'lbl lbl-stn' + (f.properties.terminus ? ' end' : ''), interactive:false}).setLatLng(ll(f.geometry.coordinates)).setContent(f.properties.name));
    });
    g._names = names;
    return g;
  },
};
const FILES = {boroughs:'boroughs', areas:'areas', nbhd:'neighbourhoods', cultural:'cultural', wards:'wards', prov:'wards', fed:'federal', bia:'bia', streets:'streets', hwy:'highways', subway:['subway_lines','subway_stations']};

/* ---------- panel ---------- */
const state = {};
const host = document.getElementById('layers');
GROUPS.forEach(([title, items]) => {
  const grp = document.createElement('div'); grp.className = 'grp';
  grp.innerHTML = '<h2>' + title + '</h2>';
  items.forEach(it => {
    const row = document.createElement('label'); row.className = 'row'; row.htmlFor = 'lyr-' + it.id;
    row.innerHTML = '<span class="sw ' + it.id + '">' + (it.swatch || '') + '</span><span class="tx"><b>' + it.name + '</b><span>' + it.note + '</span></span>' +
      '<input type="checkbox" id="lyr-' + it.id + '"' + (it.on ? ' checked' : '') + '><span class="tg" aria-hidden="true"></span>';
    grp.appendChild(row);
    row.querySelector('input').addEventListener('change', e => setLayer(it.id, e.target.checked));
    if (it.sub){
      const s = document.createElement('label'); s.className = 'sub';
      s.innerHTML = '<input type="checkbox" id="' + it.sub.id + '"' + (it.sub.on ? ' checked' : '') + '> ' + it.sub.label;
      grp.appendChild(s);
      s.querySelector('input').addEventListener('change', () => syncStnNames());
    }
    state[it.id] = !!it.on;
  });
  host.appendChild(grp);
});
function syncStnNames(){
  const L_ = layers.subway; if (!L_) return;
  const want = state.subway && document.getElementById('stnNames').checked;
  if (want && !map.hasLayer(L_._names)) L_._names.addTo(map);
  if (!want && map.hasLayer(L_._names)) map.removeLayer(L_._names);
}
const ORDER = ['boroughs','areas','bia','nbhd','fed','prov','wards','cultural','streets','hwy','go','subway','landmarks'];
function setLayer(id, on){
  state[id] = on;
  const lyr = layers[id]; if (!lyr) return;
  if (on) { lyr.addTo(map); } else { map.removeLayer(lyr); }
  if (id === 'subway') syncStnNames();
}
document.getElementById('allOff').addEventListener('click', () => {
  Object.keys(state).forEach(id => { const cb = document.getElementById('lyr-' + id); if (cb.checked){ cb.checked = false; setLayer(id, false); } });
});
const panel = document.getElementById('panel');
document.getElementById('ph').addEventListener('click', () => { if (matchMedia('(max-width:760px)').matches) panel.classList.toggle('collapsed'); });
if (matchMedia('(max-width:760px)').matches) panel.classList.add('collapsed');

/* ---------- What's here ---------- */
const here = document.getElementById('here');
let pin = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function placePin(latlng){
  if (pin) pin.setLatLng(latlng); else pin = L.marker(latlng, {pane:'pin', interactive:false, keyboard:false, icon: L.divIcon({className:'', iconSize:[20, 20], iconAnchor:[10, 10], html:'<span class="pin"></span>'})}).addTo(map);
}
function inspect(latlng, title){
  const x = latlng.lng, y = latlng.lat;
  const boro = hit(data.boroughs, x, y);
  if (!boro){
    const muni = hit(data.gta, x, y);
    if (!muni){ here.hidden = false; renderEmpty('That spot is outside the Greater Toronto Area.'); return; }
    placePin(latlng);
    const m = muni.properties;
    here.hidden = false;
    here.innerHTML = '<div class="hh"><div><small>What\u2019s here</small><strong>' + esc(title || m.name) + '</strong></div><button type="button" aria-label="Close" id="hereX">\u00d7</button></div>' +
      '<div class="pills"><span class="pill"><i style="background:var(--land-out-line)"></i>' + esc(m.name) + '</span><span class="pill"><i style="background:var(--muni-label)"></i>' + esc(m.region) + ' Region</span></div>' +
      '<p class="gta-note">Outside the City of Toronto. Wards, ridings, neighbourhoods and BIAs on this map cover Toronto only.</p>';
    document.getElementById('hereX').onclick = closeHere;
    return;
  }
  placePin(latlng);
  const area = hit(data.areas, x, y), nb = hit(data.nbhd, x, y), ward = hit(data.wards, x, y), fed = hit(data.fed, x, y), bia = hit(data.bia, x, y);
  const near = (data.cultural ? data.cultural.features : []).map(f => [f, metres([x, y], f.geometry.coordinates)]).filter(a => a[1] < 650).sort((a, b) => a[1] - b[1]).slice(0, 2);
  const bn = boro.properties.name;
  const pills = [];
  if (area) pills.push(['var(' + AREA_VAR[area.properties.name] + ')', area.properties.name]);
  else pills.push(['var(' + BORO_VAR[bn] + ')', bn]);
  near.forEach(([f]) => pills.push(['var(--cult-enclave)', f.properties.name]));
  if (bia) pills.push(['var(--bia)', bia.properties.name + ' BIA']);
  if (fed) pills.push(['var(--fed)', 'Votes in ' + fed.properties.name]);
  const facts = [
    ['Former city', bn],
    ['Area', area ? area.properties.name : (bn === 'Old Toronto' ? '—' : 'Outside Old Toronto')],
    ['Neighbourhood', nb ? nb.properties.name + ' (#' + nb.properties.code + ')' : '—'],
    ['Known as', near.length ? near.map(a => a[0].properties.name).join(', ') : '—'],
    ['BIA', bia ? bia.properties.name + (bia.properties.since ? ' (since ' + bia.properties.since + ')' : '') : 'None'],
    ['City ward', ward ? 'Ward ' + ward.properties.num + ' · ' + ward.properties.name : '—'],
    ['Provincial', ward ? ward.properties.prov : '—'],
    ['Federal', fed ? fed.properties.name : '—'],
  ];
  here.hidden = false;
  here.innerHTML = '<div class="hh"><div><small>What’s here</small><strong>' + esc(title || (y.toFixed(4) + '° N, ' + Math.abs(x).toFixed(4) + '° W')) + '</strong></div><button type="button" aria-label="Close" id="hereX">×</button></div>' +
    '<div class="pills">' + pills.map(p => '<span class="pill"><i style="background:' + p[0] + '"></i>' + esc(p[1]) + '</span>').join('') + '</div>' +
    '<dl class="facts">' + facts.map(f => '<dt>' + f[0] + '</dt><dd>' + esc(f[1]) + '</dd>').join('') + '</dl>' +
    '<button type="button" class="more" id="hereMore">' + (here.classList.contains('open') ? 'Hide details' : 'Show all details') + '</button>';
  document.getElementById('hereX').onclick = closeHere;
  document.getElementById('hereMore').onclick = () => { here.classList.toggle('open'); document.getElementById('hereMore').textContent = here.classList.contains('open') ? 'Hide details' : 'Show all details'; };
}
function renderEmpty(msg){
  here.innerHTML = '<div class="hh"><div><small>What’s here</small><strong>Tap the map</strong></div><button type="button" aria-label="Close" id="hereX">×</button></div><div class="hint">' + esc(msg) + '</div>';
  document.getElementById('hereX').onclick = closeHere;
}
function closeHere(){ here.hidden = true; if (pin){ map.removeLayer(pin); pin = null; } }

/* ---------- Theme: Auto (device setting), Light or Dark; remembered in this browser ---------- */
function applyTheme(choice){
  if (choice === 'light' || choice === 'dark') document.documentElement.dataset.theme = choice;
  else delete document.documentElement.dataset.theme;
  document.querySelectorAll('[data-theme-choice]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeChoice === choice)));
  try { if (choice === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', choice); } catch (e) {}
}
let savedTheme = 'auto';
try { savedTheme = localStorage.getItem('theme') || 'auto'; } catch (e) {}
applyTheme(savedTheme);
document.querySelectorAll('[data-theme-choice]').forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.themeChoice)));

/* ---------- Address search (OpenStreetMap Nominatim; one request per search, per its usage policy) ---------- */
const qf = document.getElementById('qf'), q = document.getElementById('q'), go = document.getElementById('go'), results = document.getElementById('results');
let lastSearch = 0;
function showResults(html){ results.innerHTML = html; results.hidden = !html; }
function placeLabel(r){
  const a = r.address || {};
  const street = a.road || a.pedestrian || a.footway || '';
  if (a.house_number && street) return a.house_number + ' ' + street;
  return r.name || street || r.display_name.split(',')[0];
}
function placeSub(r){
  const a = r.address || {};
  const name = r.name && r.name !== placeLabel(r) ? r.name : '';
  return [name, a.neighbourhood || a.suburb || a.quarter, a.postcode].filter(Boolean).join(' · ');
}
function choose(r){ goTo(L.latLng(+r.lat, +r.lon), placeLabel(r), true); }
function goTo(latlng, name, fromSearch){
  showResults('');
  if (fromSearch) q.value = name;
  inspect(latlng, name);  // fill the card first, so a map-move problem can't hide the result
  const zoom = Math.max(map.getZoom(), 15);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try {
    const size = map.getSize();
    if (calm || !size.x || !size.y) map.setView(latlng, zoom, {animate: false});
    else map.flyTo(latlng, zoom, {duration: .8});
  } catch (err){ try { map.setView(latlng, zoom, {animate: false}); } catch (e2){} }
}
let busy = false;
async function geocode(url){
  // One retry after a pause covers a brief rate-limit (HTTP 429) or network hiccup.
  for (let attempt = 0; ; attempt++){
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(url, {signal: ctl.signal, headers: {'Accept-Language': 'en'}});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (err){
      if (attempt >= 1) throw err;
      await new Promise(r => setTimeout(r, 1500));
    }
  }
}
qf.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || !data.boroughs || busy) return;
  const exact = landmarkMatches(text).filter(x => x.s === 0);
  if (exact.length === 1){ goLandmark(exact[0].f); return; }
  busy = true;
  const wait = 1100 - (Date.now() - lastSearch);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastSearch = Date.now();
  go.disabled = true; go.textContent = '\u2026';
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=ca&bounded=1' +
    '&viewbox=-79.64,43.86,-79.11,43.58&q=' + encodeURIComponent(text);
  try {
    let list;
    try { list = await geocode(url); }
    catch (err){ showResults('<li class="msg">Address search isn\u2019t responding right now. Try again in a moment, or tap the map instead.</li>'); return; }
    // Keep matches inside the city, and merge repeats of the same address (one per entrance/postcode).
    const inCity = [];
    list.filter(r => hit(data.boroughs, +r.lon, +r.lat)).forEach(r => {
      const dup = inCity.some(k => placeLabel(k) === placeLabel(r) && metres([+k.lon, +k.lat], [+r.lon, +r.lat]) < 150);
      if (!dup) inCity.push(r);
    });
    if (!inCity.length){
      showResults('<li class="msg">No match inside the City of Toronto for “' + esc(text) + '”. Try the full street name, like “789 Yonge Street”.</li>');
    } else if (inCity.length === 1){
      choose(inCity[0]);
    } else {
      window.__hits = inCity;
      showResults(inCity.map((r, i) => '<li><button type="button" data-i="' + i + '">' + esc(placeLabel(r)) + (placeSub(r) ? '<span>' + esc(placeSub(r)) + '</span>' : '') + '</button></li>').join(''));
      results.querySelectorAll('button').forEach(b => b.addEventListener('click', () => choose(window.__hits[+b.dataset.i])));
      results.querySelector('button').focus();
    }
  } catch (err){
    console.error(err);
    showResults('<li class="msg">Something went wrong showing that result. Try again, or tap the map instead.</li>');
  } finally { busy = false; go.disabled = false; go.textContent = 'Find'; }
});
q.addEventListener('keydown', e => { if (e.key === 'Escape'){ showResults(''); q.blur(); } });
/* Landmark suggestions: instant, local, no network (Nominatim's policy rules out
   autocomplete-as-you-type, so live suggestions come only from our own curated list). */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['\u2019]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function landmarkMatches(text){
  const qq = norm(text);
  if (qq.length < 2 || !data.landmarks) return [];
  const out = [];
  data.landmarks.features.forEach(f => {
    let best = null;
    [f.properties.name].concat(f.properties.aliases).forEach((n, i) => {
      const nn = norm(n);
      const s = nn === qq ? 0 : nn.startsWith(qq) ? 1 : (' ' + nn).includes(' ' + qq) ? 2 : null;
      if (s !== null && (!best || s < best.s)) best = {s, alias: i ? n : null};
    });
    if (best) out.push({f, ...best});
  });
  return out.sort((a, b) => a.s - b.s || a.f.properties.tier - b.f.properties.tier || a.f.properties.name.localeCompare(b.f.properties.name)).slice(0, 5);
}
function goLandmark(f){ goTo(L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]), f.properties.name, true); }
q.addEventListener('input', () => {
  const m = landmarkMatches(q.value);
  if (!m.length){ showResults(''); return; }
  window.__lm = m;
  showResults(m.map((x, i) => '<li><button type="button" data-lm="' + i + '">' + esc(x.f.properties.name) +
    '<span>' + esc(x.f.properties.catLabel) + (x.alias ? ' \u00b7 also called ' + esc(x.alias) : '') + '</span></button></li>').join('') +
    '<li class="msg">Press Find to search all Toronto addresses</li>');
  results.querySelectorAll('[data-lm]').forEach(b => b.addEventListener('click', () => goLandmark(window.__lm[+b.dataset.lm].f)));
});
q.addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ const b = results.querySelector('button'); if (b){ e.preventDefault(); b.focus(); } } });
results.addEventListener('keydown', e => {
  const bs = [...results.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < bs.length - 1){ e.preventDefault(); bs[i + 1].focus(); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); (i > 0 ? bs[i - 1] : q).focus(); }
  if (e.key === 'Escape'){ showResults(''); q.focus(); }
});

/* ---------- load ---------- */
renderEmpty('Loading map data…');
Promise.all([get('base'), get('boroughs'), get('areas'), get('neighbourhoods'), get('cultural'), get('wards'), get('federal'), get('bia'), get('streets'), get('highways'), get('subway_lines'), get('subway_stations'), get('regions'), get('landmarks'), get('gta_highways'), get('gta_shields'), get('go_lines'), get('go_stations')])
.then(([base, boroughs, areas, nbhd, cultural, wards, fed, bia, streets, hwy, sl, ss, regions, landmarks, gtaHwy, gtaShields, goLines, goStns]) => {
  Object.assign(data, {boroughs, areas, nbhd, cultural, wards, fed, bia, landmarks,
    gta: {type:'FeatureCollection', features: base.features.filter(f => f.properties.kind === 'neighbour')}});
  buildBase(base, regions);
  const src = {boroughs, areas, nbhd, cultural, wards, prov: wards, fed, bia, streets, hwy: [hwy, gtaHwy, gtaShields], go: [goLines, goStns], subway: [sl, ss], landmarks};
  ORDER.forEach(id => { layers[id] = BUILD[id](src[id]); });
  ORDER.forEach(id => { if (state[id]) layers[id].addTo(map); });
  syncStnNames();
  zoomClasses();
  inspect(L.latLng(43.67194, -79.38667), 'Toronto Reference Library (example)');
}).catch(err => { renderEmpty('The map data didn’t load (' + err.message + '). Reload the page to try again.'); });
})();
</script>
